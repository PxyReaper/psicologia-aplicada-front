<div class="flex flex-col h-screen">
  @if (showNav()) {
    <nav class="flex items-center gap-4 px-4 md:px-6 h-14 bg-white border-b border-slate-200 shadow-sm">
      <span class="font-bold text-lg text-primary">Psicología Aplicada</span>
      <div class="flex items-center gap-1 flex-1">
        <a routerLink="/patients" routerLinkActive="active"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-500 no-underline transition-colors hover:bg-primary/5 hover:text-primary [&.active]:bg-primary/10 [&.active]:text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Pacientes
        </a>
        <a routerLink="/sessions" routerLinkActive="active"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-500 no-underline transition-colors hover:bg-primary/5 hover:text-primary [&.active]:bg-primary/10 [&.active]:text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          Sesiones
        </a>
        @if (authService.userRole() === 'ADMIN') {
          <a routerLink="/users" routerLinkActive="active"
             class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-500 no-underline transition-colors hover:bg-primary/5 hover:text-primary [&.active]:bg-primary/10 [&.active]:text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            Usuarios
          </a>
        }
      </div>
      <div class="flex items-center gap-3">
        <span class="text-sm text-slate-400 hidden sm:block">{{ authService.userEmail() }}</span>
        <button (click)="logout()"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm text-slate-500 border border-slate-200 bg-white hover:bg-slate-50 hover:text-red-600 hover:border-red-200 transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="hidden sm:inline">Salir</span>
        </button>
      </div>
    </nav>
  }
  <main class="flex-1 overflow-auto bg-[#f5f7fa]">
    <router-outlet />
  </main>
</div>
