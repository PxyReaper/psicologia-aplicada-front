<app-toast-container />
<div class="flex flex-col lg:flex-row h-full">
  <!-- Sidebar with calendar -->
  <aside class="w-full lg:w-80 shrink-0 border-b lg:border-b-0 lg:border-r border-slate-200 bg-white p-4 overflow-y-auto">
    <app-session-calendar
      [selectedDate]="selectedDate()"
      (selectDate)="onDateSelect($event)"
    />
  </aside>

  <!-- Weekly View -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <app-session-week-grid
      [weekDays]="weekDays()"
      [sessionsByDay]="sessionsByDay()"
      [loading]="loading()"
      (createSession)="handleCreateSession($event)"
      (editSession)="handleEditSession($event)"
      (moveSession)="handleMoveSession($event)"
    />
  </main>
</div>

@if (showDialog()) {
  <app-session-dialog
    [show]="showDialog()"
    [editingSession]="editingSession()"
    [patientOptions]="patientOptions()"
    [saving]="saving()"
    [newSessionPreset]="sessionDialogPreset()"
    (save)="handleSaveSession($event)"
    (delete)="handleDelete()"
    (close)="handleDialogClose()"
  />
}
